name: Flink SQL Runner CI

on:
  release:
    types: [ created ]
  push:
    branches:
      - main
      - release-*
  pull_request:
    branches:
      - main
      - release-*

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cache-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: read

    outputs:
      project-version: ${{ steps.version.outputs.project_version }}
      flink-version-label: ${{ steps.version.outputs.flink_version_label }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: ./.github/actions/setup-jdk

      - name: Download dependencies
        run: |
          mvn -B org.apache.maven.plugins:maven-dependency-plugin:3.9.0:go-offline de.qaware.maven:go-offline-maven-plugin:1.2.8:resolve-dependencies
          mvn -B -f flink-sql-runner/pom.xml org.apache.maven.plugins:maven-resources-plugin:3.3.1:resources

      - name: Get project version
        id: version
        env:
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" && "$EVENT_ACTION" == "created" ]]; then
            echo "project_version=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
          else
            echo "project_version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT
          fi
          echo "flink_version_label=$(mvn help:evaluate -Dexpression=flink.version.label -q -DforceStdout)" >> $GITHUB_OUTPUT

  unit-test:
    runs-on: ubuntu-latest
    needs: cache-dependencies
    timeout-minutes: 20

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: ./.github/actions/setup-jdk

      - name: Run unit tests
        run: mvn -B test

  integration-test:
    runs-on: ubuntu-latest
    needs: cache-dependencies
    timeout-minutes: 30

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: ./.github/actions/setup-jdk

      - name: Run integration tests
        run: mvn -B install -Dtest=skip

  maven-deploy:
    runs-on: ubuntu-latest
    needs: [ unit-test, integration-test, cache-dependencies ]
    if: |
      (github.event_name == 'release' && github.event.action == 'created') ||
      (github.event_name == 'push' && github.ref_name == 'main')
    timeout-minutes: 20

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: ./.github/actions/setup-jdk

      - name: Import GPG Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "default-key $(gpg --list-keys --with-colons | grep pub | cut -d':' -f5)" >> ~/.gnupg/gpg.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf

      - name: Setup Maven settings
        uses: ./.github/actions/setup-maven-settings
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}
          additional-servers: ${{ secrets.MAVEN_SETTINGS_SERVER_CENTRAL }}

      - name: Update version
        if: github.event_name == 'release' && github.event.action == 'created'
        env:
          VERSION: ${{ needs.cache-dependencies.outputs.project-version }}
        run: |
          mvn -B versions:set -DnewVersion="$VERSION"

      # Releases also go to GitHub Packages, so they can be resolved when Maven Central rejects them (it caps what the
      # com.datasqrl namespace publishes per month). Only the github-release profile gives them a repository there.
      # Modules are deployed one after the other in reactor order, and the last one only has a POM. So a re-run skips the
      # deploy once that is there, instead of failing because GitHub rejects re-uploading a release's files with 409.
      - name: Deploy release to GitHub Packages
        id: github-packages
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.cache-dependencies.outputs.project-version }}
        run: |
          LAST=flink-sql-runner-dependencies
          if curl -sfLo /dev/null -u "$GITHUB_ACTOR:$GITHUB_TOKEN" \
              "https://maven.pkg.github.com/DataSQRL/flink-sql-runner/com/datasqrl/flinkrunner/$LAST/$VERSION/$LAST-$VERSION.pom"; then
            echo "$VERSION is already on GitHub Packages, skipping its deploy"
          else
            mvn -B clean deploy -Pci,github-release
          fi

      # Also runs when only the GitHub Packages deploy failed, so one repository failing doesn't hold back the other.
      - name: Deploy to Maven Central
        if: github.event_name == 'release' && (success() || steps.github-packages.outcome == 'failure')
        run: mvn -B clean deploy -Pci,central-release

      - name: Deploy snapshot to GitHub Packages
        if: github.ref_name == 'main'
        run: mvn -B clean deploy -Pci -DskipTests

  build-and-push-docker-image:
    runs-on: ubuntu-latest
    needs: [ unit-test, integration-test, cache-dependencies ]
    timeout-minutes: 30

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: ./.github/actions/setup-jdk

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Setup Maven settings
        uses: ./.github/actions/setup-maven-settings
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-actor: ${{ github.actor }}

      - name: Pull base Docker image
        run: |
          mvn -B -f flink-sql-runner/pom.xml org.apache.maven.plugins:maven-resources-plugin:3.3.1:resources
          grep '^FROM' flink-sql-runner/target/Dockerfile | awk '{print $2}' | xargs -n1 docker pull

      - name: Update version
        if: github.event_name == 'release' && github.event.action == 'created'
        env:
          VERSION: ${{ needs.cache-dependencies.outputs.project-version }}
        run: |
          mvn -B versions:set -DnewVersion="$VERSION"

      - name: Build uber jar
        run: mvn -B clean install -DskipTests

      - name: Define Docker image tag
        id: vars
        env:
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.number }}
          VERSION: ${{ needs.cache-dependencies.outputs.project-version }}
          FLINK_VERSION_LABEL: ${{ needs.cache-dependencies.outputs.flink-version-label }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" && "$EVENT_ACTION" == "created" ]]; then
            echo "image_tag=datasqrl/flink-sql-runner:${VERSION}-${FLINK_VERSION_LABEL}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "image_tag=ghcr.io/datasqrl/flink-sql-runner:${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "image_tag=ghcr.io/datasqrl/flink-sql-runner:pr-${PR_NUMBER}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ (github.event_name == 'release' && github.event.action == 'created') && 'docker.io' || 'ghcr.io' }}
          username: ${{ (github.event_name == 'release' && github.event.action == 'created') && secrets.DOCKER_USERNAME || github.actor }}
          password: ${{ (github.event_name == 'release' && github.event.action == 'created') && secrets.DOCKER_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./flink-sql-runner/target
          file: ./flink-sql-runner/target/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.vars.outputs.image_tag }}

      - name: Rename jar file
        if: github.event_name == 'release' && github.event.action == 'created'
        env:
          VERSION: ${{ needs.cache-dependencies.outputs.project-version }}
          FLINK_VERSION_LABEL: ${{ needs.cache-dependencies.outputs.flink-version-label }}
        run: |
          mv flink-sql-runner/target/flink-sql-runner.uber.jar "flink-sql-runner/target/flink-sql-runner-${VERSION}-${FLINK_VERSION_LABEL}.jar"

      # Attach what running the runner on a Flink cluster other than this image takes: the uber jar, and stdlib-utils,
      # which the uber jar leaves out because Flink has to load it from /opt/flink/lib. Every other module is inside the
      # uber jar, and library users get them, with their dependencies, from Maven.
      - name: Upload to GitHub Release
        if: github.event_name == 'release' && github.event.action == 'created'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            flink-sql-runner/target/flink-sql-runner-${{ needs.cache-dependencies.outputs.project-version }}-${{ needs.cache-dependencies.outputs.flink-version-label }}.jar
            stdlib/stdlib-utils/target/stdlib-utils-${{ needs.cache-dependencies.outputs.project-version }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ unit-test, integration-test ]
    if: always()
    steps:
      - name: Check test results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "Checking results of upstream jobs..."
          FAILED_JOBS=""

          for job in $(echo "$NEEDS_JSON" | jq -r 'keys[]'); do
            result=$(echo "$NEEDS_JSON" | jq -r ".[\"$job\"].result")
            echo "  $job: $result"
            if [[ "$result" != "success" ]]; then
              FAILED_JOBS="$FAILED_JOBS $job"
            fi
          done

          if [[ -n "$FAILED_JOBS" ]]; then
            echo "One or more jobs did not succeed:$FAILED_JOBS"
            exit 1
          fi
