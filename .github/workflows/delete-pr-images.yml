name: Delete GHCR image on PR close

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  delete-ghcr:
    runs-on: ubuntu-latest
    permissions:
      # Deleting a version with GITHUB_TOKEN also requires this repository to
      # have the Admin role under the package's "Manage Actions access" settings.
      packages: write
    steps:
      - name: Delete GHCR image via GitHub REST API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: DataSQRL
          PACKAGE: flink-sql-runner
          TAG: pr-${{ github.event.number }}
        run: |
          # Keep xtrace (-x) off: it echoes every expanded command into the job log.
          set -euo pipefail

          echo "🔍 Searching $ORG/$PACKAGE for tag: $TAG..."

          PACKAGE_VERSION_ID=$(gh api --paginate \
            "/orgs/$ORG/packages/container/$PACKAGE/versions?per_page=100" \
            | jq -rs --arg TAG "$TAG" '
              first(.[][] | select(any(.metadata.container.tags[]?; . == $TAG)) | .id) // empty')

          if [[ -z "$PACKAGE_VERSION_ID" ]]; then
            echo "⚠ Package version with tag $TAG not found, skip deletion."
            exit 0
          fi

          echo "🗑️ Deleting package version ID: $PACKAGE_VERSION_ID..."

          if gh api --method DELETE --silent \
            "/orgs/$ORG/packages/container/$PACKAGE/versions/$PACKAGE_VERSION_ID"; then
            echo "✅ Successfully deleted GHCR tag $TAG (version ID $PACKAGE_VERSION_ID)"
          else
            echo "❌ Failed to delete package version $PACKAGE_VERSION_ID."
            exit 1
          fi
