name: 'Setup Maven Settings XML'
description: 'Generates Maven settings.xml with GitHub Packages authentication'

inputs:
  github-token:
    description: 'GitHub token for authentication'
    required: true
  github-actor:
    description: 'GitHub actor username'
    required: true
  additional-servers:
    description: 'Additional server configurations to include'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Generate settings.xml
      shell: bash
      # The inputs reach the script only as environment variables, so the shell expands them once and never runs them
      env:
        GITHUB_PACKAGES_USERNAME: ${{ inputs.github-actor }}
        GITHUB_PACKAGES_TOKEN: ${{ inputs.github-token }}
        ADDITIONAL_SERVERS: ${{ inputs.additional-servers }}
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml <<EOF
        <settings>
          <servers>
            <server>
              <id>github</id>
              <username>${GITHUB_PACKAGES_USERNAME}</username>
              <password>${GITHUB_PACKAGES_TOKEN}</password>
            </server>
            ${ADDITIONAL_SERVERS}
          </servers>
        </settings>
        EOF
