status = error
name = kafka-probe

# Client logs go to stderr so the staged probe output on stdout stays parseable.
appender.console.type = Console
appender.console.name = STDERR
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} %-5level %logger{1} - %msg%n

rootLogger.level = ${sys:kafkaProbe.rootLevel:-ERROR}
rootLogger.appenderRef.stderr.ref = STDERR

logger.kafka.name = org.apache.kafka
logger.kafka.level = ${sys:kafkaProbe.kafkaLevel:-ERROR}
